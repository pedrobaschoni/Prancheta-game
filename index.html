<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Prancheta: carreira de técnico de futebol com 14 ligas, copas e decisões em cartas. Desenvolvido por Pedro Baschoni.">
<meta name="theme-color" content="#0a141d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Prancheta</title>
<meta name="author" content="Pedro Baschoni">
<style>
@font-face{font-family:'Barlow';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Big Shoulders Display';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/big-shoulders-display-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Big Shoulders Display';font-weight:800;font-style:normal;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Big Shoulders Display';font-weight:900;font-style:normal;font-display:swap;src:url(fonts/big-shoulders-display-latin-900-normal.woff2) format('woff2')}
:root{
  /* Layout: uma coluna de app (máx. 560px) sob refletores de estádio; as cores do clube tingem a interface */
  --night:#0a141d; --stand:#0f1f2b; --stand2:#152a39; --rail:#22394b; --rail2:#2e4a5e;
  --chalk:#e9eff2; --mute:#97aab8; --dim:#62798a;
  --gold:#eab84a; --good:#4cc68c; --bad:#ef5b50; --warn:#f2a63b;
  --paper:#f1f4f6; --paper2:#e1e7eb; --ink:#13202b; --ink2:#4a5c6a;
  --club:#2f6fd6; --club2:#ffffff; --clubInk:#ffffff; --accent:#6b9cf0;
  --f-disp:'Big Shoulders Display','Impact','Arial Narrow Bold',sans-serif;
  --f-body:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;color:var(--chalk);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:var(--night);
  background:radial-gradient(110% 50% at 50% -8%, color-mix(in srgb,var(--club) 24%,transparent), transparent 72%) fixed, var(--night);}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{padding-top:calc(12px + env(safe-area-inset-top,0px))!important;max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0}
#view{flex:1;display:flex;flex-direction:column;min-width:0}
h1,h2,h3{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.02em;line-height:1;margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);font-weight:600}
.btn{appearance:none;border:0;cursor:pointer;background:var(--club);color:var(--clubInk);font-family:var(--f-disp);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:19px;padding:14px 18px;border-radius:12px;transition:transform .12s, filter .2s;box-shadow:0 6px 22px -10px var(--club)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--chalk);border:1.5px solid var(--rail2);box-shadow:none}
.btn.sm{font-size:15px;padding:8px 12px;border-radius:9px}
.btn.big{width:100%;font-size:22px;padding:17px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:99px;background:var(--stand2);color:var(--mute);border:1px solid var(--rail)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.chip.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.crest{display:block;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.num{font-variant-numeric:tabular-nums}
.cred{text-align:center;font-size:13px;color:var(--dim);letter-spacing:.04em}
.cred b{color:var(--mute);font-weight:700}

/* ---------- título ---------- */
.title{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-block:24px}
.board{position:relative;border-radius:18px;overflow:hidden;background:#173a2a;border:1px solid #2a5a43;aspect-ratio:400/230;max-width:100%}
.board svg{display:block;width:100%;height:100%}
.board .arr{stroke-dasharray:6 7;animation:dash 2.6s linear infinite}
.board .pl{animation:bob 3.2s ease-in-out infinite}
.board .pl:nth-child(2n){animation-delay:-1.4s}
@keyframes dash{to{stroke-dashoffset:-52}}
@keyframes bob{50%{transform:translateY(-3px)}}
.logo{font-size:clamp(64px,19vw,112px);font-weight:900;line-height:.82;letter-spacing:-.01em}
.logo span{color:var(--accent)}
.tag{color:var(--mute);font-size:17px;max-width:40ch}
.tbtns{display:flex;flex-direction:column;gap:10px}
.tbtns .row2 .btn{font-size:16px}
.feat{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feat li{background:var(--stand);border:1px solid var(--rail);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.feat b{font-family:var(--f-disp);font-size:20px;text-transform:uppercase}
.feat span{font-size:12.5px;color:var(--mute);line-height:1.25}

/* ---------- setup ---------- */
.setup{display:flex;flex-direction:column;gap:18px;padding-block:14px 30px}
.setup h2{font-size:38px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld span{font-size:13px;color:var(--mute);font-weight:600}
.fld input{background:var(--stand);border:1.5px solid var(--rail2);border-radius:10px;padding:13px 14px;color:var(--chalk);font:600 18px var(--f-body);width:100%}
.fld input[type=color]{padding:4px;height:48px;cursor:pointer}
.phils{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.phil{background:var(--stand);border:1.5px solid var(--rail);border-radius:14px;padding:12px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.phil svg{width:100%;height:auto;display:block;border-radius:8px}
.phil b{font-family:var(--f-disp);text-transform:uppercase;font-size:18px;line-height:1}
.phil small{color:var(--mute);font-size:12.5px;line-height:1.25}
.phil.on{border-color:var(--accent);background:color-mix(in srgb,var(--club) 16%,var(--stand))}
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.look{background:var(--stand);border:1.5px solid var(--rail);border-radius:14px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600}
.look .por{width:64px;height:64px;border-radius:14px;background:var(--stand2);overflow:hidden}
.look .por svg{width:100%;height:100%;display:block}
.look.on{border-color:var(--accent);background:color-mix(in srgb,var(--club) 16%,var(--stand))}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{background:var(--stand);border:1.5px solid var(--rail);border-radius:14px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.mode b{font-family:var(--f-disp);text-transform:uppercase;font-size:20px}
.mode small{color:var(--mute);font-size:12.5px;line-height:1.3}
.mode.on{border-color:var(--accent);background:color-mix(in srgb,var(--club) 16%,var(--stand))}
.mode.on.hc{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--stand))}
.lgs{display:flex;flex-direction:column;gap:8px}
.lgrow{display:flex;gap:6px;flex-wrap:wrap}
.lgc{border:1.5px solid var(--rail);background:var(--stand);border-radius:99px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.lgc.on{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.clubs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cl{display:flex;gap:10px;align-items:center;background:var(--stand);border:1.5px solid var(--rail);border-radius:14px;padding:10px;cursor:pointer;text-align:left;min-width:0}
.cl b{display:block;font-size:15px;line-height:1.15}
.cl small{color:var(--mute);font-size:12px}
.cl.on{border-color:var(--accent);background:color-mix(in srgb,var(--club) 18%,var(--stand))}
.stars{color:var(--gold);letter-spacing:1px;font-size:12px}
.stars i{color:var(--rail2);font-style:normal}
.pick{position:sticky;bottom:0;background:linear-gradient(transparent, var(--night) 22%);padding:26px 0 calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.pickc{background:var(--stand2);border:1px solid var(--rail2);border-radius:16px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.pickc h3{font-size:26px}
.pickc dl{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 0}
.pickc dt{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute)}
.pickc dd{margin:0;font-weight:600;font-size:14px}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1}
.chals{display:flex;flex-direction:column;gap:10px}
.chal{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;background:var(--stand);border:1px solid var(--rail);border-radius:16px;padding:14px}
.chal h3{font-size:24px}
.chal p{grid-column:1/-1;color:var(--mute);font-size:14.5px}
.chal .btn{grid-column:1/-1}
.chal .done{grid-column:1/-1;justify-self:start}
.help{display:flex;flex-direction:column;gap:14px;padding-block:14px 30px}
.help h2{font-size:38px}
.help ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;color:#cfdae1}
.help b{color:var(--chalk)}

/* ---------- cabeçalho do hub ---------- */
.hdr{display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.hdr-top{display:flex;align-items:center;gap:12px}
.hdr-id{flex:1;min-width:0}
.hdr-club{font-family:var(--f-disp);font-weight:800;font-size:25px;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cash{text-align:right;display:flex;flex-direction:column}
.cash .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute)}
.cash b{font-family:var(--f-disp);font-size:21px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cash b.neg{color:var(--bad)}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.meter{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--stand);border:1px solid var(--rail);border-radius:11px;padding:7px 6px 8px;min-width:0}
.meter .mi{width:18px;height:18px;color:var(--accent)}
.meter .mi svg{width:100%;height:100%;display:block}
.meter .ml{font-size:11.5px;font-weight:600;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.meter .bar{width:100%;height:6px;border-radius:9px;background:var(--rail);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--chalk);border-radius:9px;transition:width .6s cubic-bezier(.2,.8,.2,1),background .3s}
.meter.low .bar i{background:var(--bad)}
.meter.low .mi{color:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.4}}
.meter .dot{position:absolute;top:-5px;right:-3px;width:0;height:0;border-radius:50%;background:var(--chalk);box-shadow:0 0 0 2px var(--night);transition:all .18s}
.meter .dot.s{width:8px;height:8px}
.meter .dot.l{width:13px;height:13px;top:-7px;right:-5px}
.meter .dl{position:absolute;right:6px;top:-12px;font:800 15px var(--f-disp);animation:rise 1.4s ease-out forwards;pointer-events:none}
.meter .dl.p{color:var(--good)}.meter .dl.n{color:var(--bad)}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}

/* ---------- nav ---------- */
.nav{position:sticky;bottom:0;z-index:5;margin-top:auto;display:grid;grid-template-columns:repeat(6,1fr);
  background:color-mix(in srgb,var(--stand) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--rail);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;color:var(--dim);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;min-width:0}
.nav svg{width:22px;height:22px}
.nav button.on{color:var(--chalk)}
.nav button.on svg{color:var(--accent)}
.nav .badge{position:absolute;top:3px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--stand)}
.tab{display:flex;flex-direction:column;gap:14px;padding-bottom:18px}
.sec{font-family:var(--f-disp);text-transform:uppercase;font-size:20px;letter-spacing:.04em;color:var(--mute);margin-top:6px}

/* ---------- hub ---------- */
.goal{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.goal b{color:var(--chalk);font-weight:700}
.goal em{font-style:normal;margin-left:auto;font-family:var(--f-disp);font-size:18px;color:var(--chalk);text-transform:uppercase}
.chalbar{display:flex;gap:10px;align-items:center;font-size:13.5px;background:color-mix(in srgb,var(--gold) 12%,var(--stand));border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:12px;padding:9px 12px}
.chalbar b{color:var(--gold)}
.fx{position:relative;border-radius:20px;overflow:hidden;padding:16px;border:1px solid var(--rail2);
  background:linear-gradient(100deg,color-mix(in srgb,var(--h) 60%,#0a141d) 0 50%,color-mix(in srgb,var(--a) 60%,#0a141d) 50% 100%)}
.fx::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,12,18,.25),rgba(6,12,18,.72));pointer-events:none}
.fx>*{position:relative}
.fxl{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#e6edf1;text-align:center}
.fxl b{color:var(--gold)}
.fxm{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:14px 0 12px}
.fxt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.fxt b{font-family:var(--f-disp);text-transform:uppercase;font-size:20px;line-height:1;color:#fff}
.fxt small{font-size:12px;color:#c9d4db}
.vs{font-family:var(--f-disp);font-size:40px;font-weight:900;color:#fff;opacity:.85}
.pw{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-size:20px;color:#fff;font-variant-numeric:tabular-nums}
.pwb{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}
.pwb i{display:block;height:100%;background:#fff;border-radius:9px}
.pwl{text-align:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c9d4db;margin-top:4px}
.fx.none{background:var(--stand);text-align:left}
.fx.none::before{display:none}
.fx.none h3{font-size:28px;margin:6px 0}
.fx.none p{color:var(--mute)}
.form{display:flex;gap:5px;align-items:center}
.form span{font-size:13px;color:var(--mute);margin-right:4px}
.fr{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font:800 15px var(--f-disp);color:#0a141d}
.fr.V{background:var(--good)}.fr.E{background:#b9c4cc}.fr.D{background:var(--bad)}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.news li{padding:10px 0;border-bottom:1px solid var(--rail);font-size:15px;display:flex;gap:10px}
.news li small{color:var(--dim);font-variant-numeric:tabular-nums;flex:none;width:38px}

/* ---------- elenco ---------- */
.seg{display:flex;gap:4px;background:var(--stand);border:1px solid var(--rail);border-radius:11px;padding:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:8px;font-weight:700;cursor:pointer;color:var(--mute);font-size:14px}
.seg button.on{background:var(--chalk);color:var(--ink)}
.pwr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pwr b{font-family:var(--f-disp);font-size:34px;line-height:1}
.pwr small{color:var(--mute);font-size:13px}
.grp{display:flex;flex-direction:column;gap:6px}
.grp h4{margin:8px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute)}
.prow{display:grid;grid-template-columns:auto 1fr auto 44px;gap:10px;align-items:center;width:100%;text-align:left;background:var(--stand);border:1.5px solid var(--rail);border-radius:12px;padding:8px 10px;cursor:pointer}
.prow.st{border-color:color-mix(in srgb,var(--accent) 55%,var(--rail));background:color-mix(in srgb,var(--club) 10%,var(--stand))}
.prow.sel{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,transparent)}
.prow.dim{opacity:.4}
.ovr{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font:800 20px var(--f-disp);background:var(--o);color:#0a141d;font-variant-numeric:tabular-nums}
.pinfo{min-width:0}
.pinfo b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo small{display:block;color:var(--mute);font-size:12.5px}
.capt{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:4px;background:var(--gold);color:#0a141d;font:800 11px var(--f-body);font-style:normal;vertical-align:1px}
.ptags{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.mor{height:5px;border-radius:9px;background:var(--rail);overflow:hidden}
.mor i{display:block;height:100%;background:var(--good)}
.tip{font-size:13px;color:var(--mute);background:var(--stand);border:1px dashed var(--rail2);border-radius:10px;padding:9px 12px}

/* ---------- mercado ---------- */
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--stand);border:1px solid var(--rail);border-radius:12px;padding:8px 10px}
.mrow .btn{font-size:14px;padding:8px 10px;white-space:nowrap}
.mrow .btn.sell{background:transparent;border:1.5px solid var(--rail2);color:var(--chalk);box-shadow:none}
.mrow .btn.sell.cf{border-color:var(--warn);color:var(--warn)}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.mhead b{font-family:var(--f-disp);font-size:24px;text-transform:uppercase}
.mhead span{color:var(--mute);font-size:14px}

/* ---------- tabela ---------- */
.lgsel{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.lgsel .lgc{flex:none}
.tblwrap{overflow-x:auto;border:1px solid var(--rail);border-radius:14px;background:var(--stand)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:700;padding:9px 6px;text-align:center;border-bottom:1px solid var(--rail)}
.tbl td{padding:7px 6px;text-align:center;border-bottom:1px solid color-mix(in srgb,var(--rail) 60%,transparent)}
.tbl tr:last-child td{border-bottom:0}
.tbl .tl{text-align:left}
.tbl td:first-child{width:28px;color:var(--mute);font-weight:700;box-shadow:inset 3px 0 0 transparent}
.tbl tr.q td:first-child{box-shadow:inset 3px 0 0 var(--good)}
.tbl tr.z td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.tbl tr.me{background:color-mix(in srgb,var(--club) 22%,transparent)}
.tbl tr.me td{font-weight:700}
.tc{display:flex;align-items:center;gap:8px;white-space:nowrap}
.legend{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.legend span{width:10px;height:10px;border-radius:3px;display:inline-block}
.lq{background:var(--good)}.lz{background:var(--bad);margin-left:8px}

/* ---------- copa ---------- */
.bracket{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.stage{display:flex;flex-direction:column;gap:6px;justify-content:space-around}
.stage h4{margin:0 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute)}
.tie{background:var(--stand);border:1px solid var(--rail);border-radius:10px;padding:5px 8px;font-size:13px}
.tie div{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tie div span{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.tie .w{font-weight:700}
.tie .me{color:var(--accent)}
.tie b{font-variant-numeric:tabular-nums}
.tie.pend{opacity:.6}

/* ---------- carreira ---------- */
.mgr{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;background:var(--stand);border:1px solid var(--rail);border-radius:16px;padding:16px}
.mgr .por{width:76px;height:76px;border-radius:18px;background:var(--stand2);overflow:hidden}
.mgr .por svg{width:100%;height:100%;display:block}
.mgr h3{font-size:30px}
.mgr .full{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.repb{height:10px;border-radius:9px;background:var(--rail);overflow:hidden}
.repb i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}
.nem{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,#b4453f 14%,var(--stand));border:1px solid color-mix(in srgb,#b4453f 45%,transparent);border-radius:14px;padding:12px}
.nem .por{width:54px;height:54px;border-radius:12px;background:#b4453f;overflow:hidden;flex:none}
.nem .por svg{width:100%;height:100%;display:block}
.nem b{display:block}
.nem small{color:var(--mute);font-size:13px}
.nem .h2h{margin-left:auto;font:800 20px var(--f-disp);white-space:nowrap}
.cab{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;background:var(--stand);border:1px solid var(--rail);border-radius:12px;padding:10px 6px;font-size:12px;min-width:0}
.tro svg{width:44px;height:52px}
.tro b{font-size:12.5px;line-height:1.15}
.tro small{color:var(--mute)}
.achs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.ach{display:flex;gap:9px;align-items:center;background:var(--stand);border:1px solid var(--rail);border-radius:11px;padding:8px 10px;min-width:0}
.ach i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--rail);color:var(--dim);font:800 14px var(--f-disp);font-style:normal}
.ach.on i{background:var(--gold);color:#0a141d}
.ach b{display:block;font-size:13px;line-height:1.15}
.ach small{display:block;font-size:11.5px;color:var(--mute);line-height:1.2}
.ach:not(.on) b{color:var(--mute)}
.legs{display:flex;flex-direction:column;gap:6px}
.leg{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--stand);border:1px solid var(--rail);border-radius:10px;padding:8px 10px;font-size:14px}
.leg small{color:var(--mute)}
.empty{color:var(--mute);font-size:14px;background:var(--stand);border:1px dashed var(--rail2);border-radius:12px;padding:14px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.about{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;padding:18px 12px;border-top:1px solid var(--rail);margin-top:8px}
.about b{font-family:var(--f-disp);font-size:26px;text-transform:uppercase;letter-spacing:.04em}
.about span{color:var(--mute);font-size:14px}
.about strong{color:var(--chalk)}
.edlist{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.edlist .cl{padding:8px}
.editor{display:flex;flex-direction:column;gap:14px;background:var(--stand2);border:1px solid var(--rail2);border-radius:16px;padding:16px}
.edprev{display:flex;justify-content:center}
.edcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sws{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.sw2{aspect-ratio:1;border-radius:6px;border:1.5px solid var(--rail2);cursor:pointer;padding:0;min-width:0}
.edpats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.edpats button{background:var(--stand);border:1.5px solid var(--rail);border-radius:10px;padding:6px 0;display:flex;justify-content:center;cursor:pointer}
.edpats button.on{border-color:var(--accent)}

/* ---------- cards de decisão ---------- */
.cards{flex:1;display:flex;flex-direction:column;gap:12px;padding-bottom:24px}
.chdr{display:flex;flex-direction:column;gap:8px}
.wk{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);text-align:center}
.deck{position:relative;display:flex;justify-content:center;padding-top:4px;perspective:900px}
.deck::before,.deck::after{content:"";position:absolute;left:50%;width:min(100%,400px);top:16px;bottom:-8px;border-radius:22px;background:var(--stand2);border:1px solid var(--rail);transform:translateX(-50%) scale(.94);z-index:0}
.deck::after{top:24px;bottom:-16px;transform:translateX(-50%) scale(.88);opacity:.6}
.dcard{position:relative;z-index:1;width:min(100%,400px);background:var(--paper);color:var(--ink);border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 50px -24px rgba(0,0,0,.8);touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s;animation:dealin .45s cubic-bezier(.2,.9,.25,1.1)}
.dcard.two{cursor:grab}
.dcard.drag{transition:none;cursor:grabbing}
@keyframes dealin{from{transform:translateY(30px) rotate(-3deg) scale(.96);opacity:0}}
.dcard.fly-l{transform:translateX(-140%) rotate(-24deg)!important;opacity:0}
.dcard.fly-r{transform:translateX(140%) rotate(24deg)!important;opacity:0}
.dcard.fly-u{transform:translateY(-60px) scale(.9)!important;opacity:0}
.dch{display:flex;align-items:center;gap:12px}
.por{width:76px;height:76px;border-radius:18px;background:var(--pc);overflow:hidden;flex:none;box-shadow:inset 0 -18px 30px -18px rgba(0,0,0,.35)}
.por svg{width:100%;height:100%;display:block}
.whoi{display:flex;flex-direction:column;min-width:0}
.role{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink2);font-weight:700}
.whoi b{font-size:18px;line-height:1.15}
.dct{font-size:34px;font-weight:900;color:var(--ink)}
.dcx{font-size:17px;line-height:1.45;color:#22313d}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;cursor:pointer;background:var(--ink);color:#f3f6f8;border:0;border-radius:12px;padding:13px 14px;font-weight:600;font-size:16px;transition:transform .12s,background .2s}
.opt:hover{background:#1f3241}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt:active{transform:scale(.98)}
.oc{font:800 15px var(--f-disp);white-space:nowrap;padding:2px 8px;border-radius:7px;background:rgba(255,255,255,.1)}
.oc.neg{color:#ff9a90}.oc.pos{color:#7fe0b0}
.sw{position:absolute;top:18px;max-width:46%;font:900 20px var(--f-disp);text-transform:uppercase;padding:6px 10px;border-radius:9px;border:3px solid;pointer-events:none;opacity:0;line-height:1;background:var(--paper)}
.sw.sl{right:16px;color:#c0392b;transform:rotate(8deg);opacity:var(--sl,0)}
.sw.sr{left:16px;color:#1e8a55;transform:rotate(-8deg);opacity:var(--sr,0)}
.fichas{display:flex;flex-direction:column;gap:6px}
.ficha{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--paper2);border-radius:12px;padding:8px 10px}
.ficha b{display:block;font-size:15px}
.ficha small{display:block;color:var(--ink2);font-size:12.5px}
.ficha .chip{background:#fff;color:var(--ink2);border-color:#cfd8de;margin-top:3px}
.ficha .price{font:800 17px var(--f-disp);white-space:nowrap}
.res{min-height:44px;text-align:center;color:var(--chalk);font-size:15px;padding:0 8px;opacity:0;transform:translateY(6px);transition:all .35s}
.res.on{opacity:1;transform:none}
.hint{text-align:center;font-size:12.5px;color:var(--dim);margin-top:-6px}

/* ---------- partida ---------- */
.match{display:flex;flex-direction:column;gap:10px;padding-bottom:24px}
.mcomp{text-align:center;font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);font-weight:700}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--stand);border:1px solid var(--rail);border-radius:18px;padding:12px 10px}
.sbt{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.sbt span{font-family:var(--f-disp);text-transform:uppercase;font-size:16px;line-height:1;font-weight:800}
.sbc{display:flex;flex-direction:column;align-items:center;gap:4px}
.score{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-weight:900;font-size:58px;line-height:.9;font-variant-numeric:tabular-nums}
.score i{font-style:normal;opacity:.4;font-size:40px}
.score b.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.35);color:var(--gold)}}
.clock{font:800 16px var(--f-disp);background:var(--chalk);color:var(--ink);padding:2px 10px;border-radius:7px;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.pitch{position:relative;aspect-ratio:105/68;max-width:100%;border-radius:14px;overflow:hidden;background:#2c7b46;box-shadow:0 18px 40px -20px rgba(0,0,0,.8)}
.pitch.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
.pitch canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.gov{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:4px;background:color-mix(in srgb,var(--club) 82%,transparent);color:var(--clubInk);animation:wipe .45s cubic-bezier(.2,.9,.2,1)}
.gov.o{background:rgba(10,20,29,.82);color:var(--chalk)}
.gov .gw{font:900 clamp(64px,20vw,120px)/.8 var(--f-disp);letter-spacing:.02em;animation:pop .55s cubic-bezier(.2,1.4,.3,1)}
.gov.o .gw{font-size:clamp(40px,12vw,70px);opacity:.9}
.gov .gs{font:800 20px var(--f-disp);text-transform:uppercase;letter-spacing:.06em}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes pop{from{transform:scale(.4) rotate(-6deg)}}
.mctl{display:flex;align-items:center;gap:10px}
.mctl2{display:flex;gap:10px}
.tacbar{display:flex;flex-direction:column;gap:6px;background:var(--stand);border:1px solid var(--rail);border-radius:14px;padding:10px}
.tacbar .seg button{font-size:13px;padding:8px 4px}
.tacbar .seg button.on{background:var(--club);color:var(--clubInk)}
.tachint{font-size:12.5px;color:var(--mute);min-height:1.2em}
.mctl2 .btn{flex:1}
.mctl2 .btn span{font-variant-numeric:tabular-nums;opacity:.8}
.pz{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,12,18,.45);font:900 34px var(--f-disp);letter-spacing:.12em;color:#fff}
.dec.subs{background:var(--stand2);color:var(--chalk);border:1px solid var(--rail2)}
.dec.subs h3{color:var(--chalk)}
.dec.subs p{color:var(--mute)}
.subs .tip{background:var(--stand)}
.subh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.subh span{color:var(--mute);font-weight:700;font-variant-numeric:tabular-nums}
.subs h4{margin:4px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute)}
.subs .seg button{font-size:13px;padding:7px 6px}
.enb{width:44px;height:6px;border-radius:9px;background:var(--rail);overflow:hidden}
.enb i{display:block;height:100%}
.prow:disabled{opacity:.45;cursor:not-allowed}
.pendbar{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;cursor:pointer;border:1.5px solid color-mix(in srgb,var(--gold) 55%,transparent);background:color-mix(in srgb,var(--gold) 14%,var(--stand));color:var(--chalk);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.pendbar b{font-family:var(--f-disp);font-size:17px;text-transform:uppercase;letter-spacing:.04em;color:var(--gold);white-space:nowrap}
.cardtop{display:flex;align-items:center;gap:10px}
.cardtop .wk{flex:1;text-align:left}
.mctl .seg{flex:1}
.mctl .seg button{flex:1}
.tacl{flex:1;text-align:center;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.dec{background:var(--paper);color:var(--ink);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;animation:dealin .35s}
.dec h3{font-size:28px}
.dec p{color:#22313d}
.pens{display:flex;flex-direction:column;gap:8px}
.pens div{display:flex;align-items:center;gap:10px}
.pens b{width:44px;font-family:var(--f-disp);font-size:20px}
.pens span{display:flex;gap:6px;flex-wrap:wrap}
.pens i{width:18px;height:18px;border-radius:50%;animation:pop .3s}
.pens i.ok{background:var(--good)}.pens i.no{background:var(--bad)}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:260px;overflow-y:auto}
.feed li{display:flex;gap:10px;font-size:14.5px;padding:7px 4px;border-bottom:1px solid var(--rail);animation:dealin .3s}
.feed li span{flex:none;width:30px;color:var(--dim);font-variant-numeric:tabular-nums;font-weight:700}
.feed li.gu{color:var(--good)}.feed li.go{color:#ffb3ab}.feed li.bad{color:var(--bad)}
.feed li.gu b{font-family:var(--f-disp);font-size:17px;letter-spacing:.04em}

/* ---------- pós-jogo / fim de temporada ---------- */
.post{display:flex;flex-direction:column;gap:14px;padding-block:8px 24px}
.ph{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.ph h1{font-size:clamp(54px,16vw,84px);font-weight:900}
.ph h1.V{color:var(--good)}.ph h1.D{color:var(--bad)}
.pscore{display:flex;align-items:center;justify-content:center;gap:14px;font:900 46px var(--f-disp);font-variant-numeric:tabular-nums}
.scr{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13.5px;color:var(--mute)}
.scr div:last-child{text-align:right}
.mstats{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px;color:var(--mute);background:var(--stand);border:1px solid var(--rail);border-radius:12px;padding:10px 12px;font-variant-numeric:tabular-nums}
.mstats b{color:var(--chalk);font-size:15px}
.mstats .sbar{height:6px;border-radius:9px;background:var(--rail);overflow:hidden;display:flex}
.mstats .sbar i{display:block;height:100%;background:var(--accent)}
.mstats span{text-align:center}
.deltas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.deltas div{background:var(--stand);border:1px solid var(--rail);border-radius:11px;padding:8px;text-align:center;font-size:12px;color:var(--mute)}
.deltas b{display:block;font:800 22px var(--f-disp);color:var(--chalk)}
.deltas b.p{color:var(--good)}.deltas b.n{color:var(--bad)}
.results{display:flex;flex-direction:column;border:1px solid var(--rail);border-radius:14px;background:var(--stand);overflow:hidden}
.rr{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:7px 10px;font-size:13.5px;border-bottom:1px solid color-mix(in srgb,var(--rail) 60%,transparent)}
.rr:last-child{border-bottom:0}
.rr span{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.rr span:last-child{justify-content:flex-end}
.rr b{font-variant-numeric:tabular-nums;font-family:var(--f-disp);font-size:17px}
.rr.me{background:color-mix(in srgb,var(--club) 20%,transparent)}
.banner{border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center;background:linear-gradient(120deg,color-mix(in srgb,var(--gold) 30%,var(--stand)),var(--stand));border:1px solid color-mix(in srgb,var(--gold) 50%,transparent)}
.banner svg{width:56px;height:66px;flex:none}
.banner h3{font-size:26px;color:var(--gold)}
.banner.bad{background:color-mix(in srgb,var(--bad) 18%,var(--stand));border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.banner.bad h3{color:var(--bad)}
.banner.good{background:color-mix(in srgb,var(--good) 16%,var(--stand));border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.banner.good h3{color:var(--good)}
.endv{display:flex;flex-direction:column;gap:14px;padding-block:14px 30px}
.endv h1{font-size:clamp(46px,13vw,74px);font-weight:900}
.endpos{display:flex;gap:14px;align-items:center;background:var(--stand);border:1px solid var(--rail);border-radius:16px;padding:14px}
.endpos b{font-family:var(--f-disp);font-size:34px;text-transform:uppercase;display:block;line-height:1}
.endpos small{display:block;color:var(--mute);font-size:13.5px}
.reason{color:var(--chalk);font-size:16px}
.champs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.champs div{display:flex;gap:8px;align-items:center;background:var(--stand);border:1px solid var(--rail);border-radius:10px;padding:7px 9px;font-size:12.5px;min-width:0}
.champs small{display:block;color:var(--mute);font-size:11px}
.offers{display:flex;flex-direction:column;gap:10px}
.offer{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;padding:14px;border-radius:16px;border:1.5px solid var(--rail2);background:linear-gradient(110deg,color-mix(in srgb,var(--oc) 34%,var(--stand)),var(--stand) 70%);animation:dealin .5s backwards}
.offer:nth-child(2){animation-delay:.12s}.offer:nth-child(3){animation-delay:.24s}
.offer h3{font-size:26px}
.offer p{font-size:13.5px;color:var(--mute)}
.offer .btn{grid-column:1/-1;margin-top:8px}

/* ---------- cerimônia ---------- */
.cer{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:24px;background:radial-gradient(70% 55% at 50% 40%,rgba(234,184,74,.35),rgba(6,12,18,.94) 70%);animation:fadein .4s}
@keyframes fadein{from{opacity:0}}
.cer-in{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:420px}
.cer-t{perspective:600px}
.cer-t svg{width:150px;height:180px;animation:spin3d 3.6s linear infinite;filter:drop-shadow(0 10px 30px rgba(234,184,74,.55))}
@keyframes spin3d{to{transform:rotateY(360deg)}}
.cer h2{font-size:clamp(40px,12vw,64px);font-weight:900;color:var(--gold)}
.cer p{color:#dfe7ec;font-size:16px}
.cer .btn{margin-top:10px;min-width:220px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--chalk);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14.5px;opacity:0;transition:all .3s;z-index:60;pointer-events:none;max-width:min(90vw,420px);text-align:center}
.toast.gold{background:var(--gold)}
.toast.on{opacity:1;transform:translateX(-50%)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:58}
@media (min-width:600px){ .clubs{grid-template-columns:repeat(3,1fr)} .edlist{grid-template-columns:repeat(3,1fr)} .achs{grid-template-columns:repeat(3,1fr)} }
@media (max-width:380px){ .meter .ml{font-size:10.5px} .phils{grid-template-columns:1fr} .phil{flex-direction:row;align-items:center} .phil svg{width:70px;flex:none} .nav button{font-size:9.5px} }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }
</style>

</head>
<body>

const byId=id=>S.squad.find(p=>p.id===id);
function randP(f){const l=S.squad.filter(f||(()=>true));return l.length?pick(l):S.squad[0]}
function mor(p,d){if(p)p.mor=clamp(p.mor+d,0,100)}
const cap=()=>byId(S.captain)||best();
const winsIn=n=>S.res.length>=n?S.res.slice(-n).filter(x=>x==='V').length:0;
const lossesIn=n=>S.res.slice(-n).filter(x=>x==='D').length;

function weekShort(){const e=S.cal&&S.cal[S.wk];return e?(e.t==='lg'?'R'+(e.r+1):e.t==='mun'?'Mund.':'Copa'):'—'}
function weekLbl(){const e=S.cal[S.wk];if(!e)return 'Fim de temporada';return e.t==='lg'?`Rodada ${e.r+1} de 18`:e.t==='cup'?`${CUPS[userCont()]} · ${STAGES[e.s]}`:e.t==='dc'?`${DCUP[country()]} · ${STAGES[e.s]}`:'Mundial de Clubes'}
const finHit=p=>-clamp(Math.round(p/Math.max(S.budget,.5)*22),2,30);
const finGain=p=>clamp(Math.round(p/Math.max(S.budget,.5)*16),2,22);
function value(p){const af=p.age<=21?1.35:p.age<=25?1.15:p.age<=28?1:p.age<=31?.65:.3;return r1(3*Math.exp((p.ovr-65)/5.9)*af*(1+Math.max(0,p.pot-p.ovr)*.03))}
function ovrCol(o){return o>=85?'#eab84a':o>=79?'#4cc68c':o>=72?'#7fb7da':o>=65?'#b9c4cc':'#7c8d99'}
const baseStr=c=>c.base!=null?c.base:45+c.rep*.43-(isD2(c.lg)?1.5:0);
const natC=p=>NATC[p.nat]||String(p.nat||'').toUpperCase();
function realXI(cid,c){const L=REALSQ[cid];if(!L)return null;const fill=45+c.rep*.43-6;let t=[];for(const [pos,n] of [['GOL',1],['DEF',4],['MEI',3],['ATA',3]]){const g=L.filter(p=>p.pos===pos).map(p=>p.ovr).sort((a,b)=>b-a).slice(0,n);while(g.length<n)g.push(fill);t=t.concat(g)}return avg(t)}
function applyRealStr(){if(!REAL)return;S.clubs.forEach(c=>{const x=realXI(c.id,c);if(x!=null){c.base=r1(x);c.str=c.base+gauss()*1}})}
function realPlayer(rp,cid){const age=rp.age+(S.season-1);const o=clamp(rp.ovr-(age>32?Math.min(6,(age-32)*(S.season-1)):0),40,95);
 return {id:S.pid++,rk:rp.rk,n:rp.n,nat:rp.nat,pos:rp.pos,age,ovr:o,pot:age<=21?Math.min(96,o+ri(3,9)):age<=24?o+ri(1,4):o,tr:chance(.3)?pick(TRAIT_POOL.filter(t=>t!=='joia')):null,mor:ri(55,75),st:false,inj:0,susp:0,g:0,j:0,cg:0}}

/* =================== jogadores =================== */
function genName(nat){const N=NAMES[nat];if(nat==='br'&&chance(.25))return pick(N.k);return pick(N.f)+' '+pick(N.l)}
function natFor(lg){const home=LEAGUES[lg].nat;if(chance(.66))return home;return pick(LEAGUES[lg].cont==='EU'?['es','en','it','de','fr','br','ar','br','fr']:['br','ar','br','ar','es','it'])}
function genPlayer(lg,pos,mean,amin=17,amax=34){
 const age=ri(amin,amax);let o=Math.round(mean+gauss()*4.5-(age<21?4:0)-(age>32?2:0));o=clamp(o,42,94);
 let pot=age<=20?o+ri(6,18):age<=23?o+ri(2,10):age<=27?o+ri(0,3):o;pot=clamp(pot,o,96);
 const nat=natFor(lg);let tr=chance(.42)?pick(TRAIT_POOL):null;if(age<=20&&pot>=o+12&&chance(.6))tr='joia';
 return {id:S.pid++,n:genName(nat),nat,pos,age,ovr:o,pot,tr,mor:ri(55,75),st:false,inj:0,susp:0,g:0,j:0,cg:0};
}
function genSquad(cid){const c=S.clubs[cid];
 if(REALSQ[cid]){const sq=REALSQ[cid].filter(rp=>!S.taken[rp.rk]).map(rp=>{S.taken[rp.rk]=1;return realPlayer(rp,cid)});const need={GOL:2,DEF:6,MEI:6,ATA:4};for(const pos in need)while(sq.filter(p=>p.pos===pos).length<need[pos])sq.push(genPlayer(c.lg,pos,c.str-12,17,21));return sq}
 const sq=[];for(const [pos,a,b] of [['GOL',1,2],['DEF',4,4],['MEI',4,4],['ATA',2,3]]){for(let i=0;i<a;i++)sq.push(genPlayer(c.lg,pos,c.str-1.5));for(let i=0;i<b;i++)sq.push(genPlayer(c.lg,pos,c.str-6))}return sq}
function autoXI(){S.squad.forEach(p=>p.st=false);const f=FORMS[S.form].c;for(const pos in f)S.squad.filter(p=>p.pos===pos&&!p.inj).sort((a,b)=>b.ovr-a.ovr).slice(0,f[pos]).forEach(p=>p.st=true)}
function fixXI(){const f=FORMS[S.form].c;for(const pos in f){const g=S.squad.filter(p=>p.pos===pos);let s=g.filter(p=>p.st).sort((a,b)=>a.ovr-b.ovr);while(s.length>f[pos]){s[0].st=false;s.shift()}const b=g.filter(p=>!p.st).sort((a,b)=>b.ovr-a.ovr);while(s.length<f[pos]&&b.length){const p=b.shift();p.st=true;s.push(p)}}}
function effXI(){const f=FORMS[S.form].c;const xi=[];for(const pos in f){const g=S.squad.filter(p=>p.pos===pos);const ok=p=>!p.inj&&!p.susp;const s=g.filter(p=>p.st&&ok(p));const b=g.filter(p=>!p.st&&ok(p)).sort((a,b)=>b.ovr-a.ovr);while(s.length<f[pos]&&b.length)s.push(b.shift());xi.push(...s.slice(0,f[pos]))}return xi}
function promote(p){if(p.st)return;const w=starters().filter(x=>x.pos===p.pos).sort((a,b)=>a.ovr-b.ovr)[0];if(w){w.st=false;mor(w,-8)}p.st=true}
function removeP(p){S.squad=S.squad.filter(x=>x.id!==p.id);if(S.captain===p.id)S.captain=null;fixXI()}
function addP(p){if(p.rk&&S.taken)S.taken[p.rk]=1;delete p.price;delete p.from;delete p.kind;delete p.fcid;S.squad.push(p);fixXI()}
const userAvg=()=>avg(effXI().map(p=>p.ovr));
function weakPos(){let w='MEI',wv=99;for(const pos of ['DEF','MEI','ATA']){const v=avg(starters().filter(p=>p.pos===pos).map(p=>p.ovr));if(v&&v<wv){wv=v;w=pos}}return w}
function realMarket(kind,pos){const a=userAvg();const tgt=kind==='star'?a+4:kind==='young'?a-2:kind==='vet'?a+1:kind==='joia'?a-6:a;
 const cand=[];for(const k in REALSQ){const cid=+k;if(cid===S.club)continue;for(const rp of REALSQ[k]){if(S.taken[rp.rk]||rp.pos!==pos)continue;const age=rp.age+(S.season-1);
  if((kind==='young'||kind==='joia')&&age>21)continue;if(kind==='vet'&&age<31)continue;if(kind==='star'&&(age<22||age>30))continue;cand.push([Math.abs(rp.ovr-tgt)+R()*2,rp,cid])}}
 cand.sort((x,y)=>x[0]-y[0]);const top=cand.slice(0,6);if(!top.length)return null;const [,rp,cid]=pick(top);const p=realPlayer(rp,cid);p.from=S.clubs[cid].name;p.fcid=cid;
 p.price=r1(Math.max(.2,value(p)*pf()*(.9+R()*.4)*(LEAGUES[S.clubs[cid].lg].cont==='EU'&&userCont()==='SA'?2:1)));if(kind==='vet')p.price=r1(Math.max(.2,p.price*.6));p.kind=kind;return p}
function marketPlayer(kind){
 const lg=club().lg,a=userAvg();
 if(REAL&&chance(.8)){const pos0=kind==='gk'?'GOL':chance(.6)?weakPos():pick(['DEF','MEI','ATA','MEI','ATA']);const rp=realMarket(kind,pos0);if(rp)return rp}const pos=kind==='gk'?'GOL':chance(.6)?weakPos():pick(['DEF','MEI','ATA','MEI','ATA']);let p;
 if(kind==='star')p=genPlayer(lg,pos,a+ri(3,6),24,29);
 else if(kind==='young'){p=genPlayer(lg,pos,a-ri(1,3),18,21);p.pot=Math.max(p.pot,p.ovr+ri(8,16))}
 else if(kind==='vet')p=genPlayer(lg,pos,a+ri(0,3),32,34);
 else if(kind==='joia'){const n=pick(['br','ar','br']);p=genPlayer(lg,pos,a-ri(4,8),17,19);p.nat=n;p.n=genName(n);p.pot=Math.min(96,p.ovr+ri(16,24));p.tr='joia'}
 else p=genPlayer(lg,pos,a+gauss()*6,20,30);
 const pool=kind==='joia'?S.clubs.filter(c=>LEAGUES[c.lg].cont==='SA'&&c.id!==S.club):S.clubs.filter(c=>c.id!==S.club);
 p.from=pick(pool).name;p.price=r1(Math.max(.2,value(p)*pf()*(.85+R()*.4)));if(kind==='vet')p.price=r1(Math.max(.2,p.price*.5));p.kind=kind;return p;
}

/* =================== força e simulação =================== */
function userPower(){const xi=effXI();let r=avg(xi.map(p=>p.ovr));if(xi.length<11)r-=(11-xi.length)*3;r+=clamp((avg(xi.map(p=>p.mor))-60)/14+(S.m.ves-50)/30,-3,3);if(xi.some(p=>p.tr==='lider'))r+=.6;r+=S.mod||0;return r}
function syncStr(){if(S.squad&&S.squad.length)S.clubs[S.club].str=userPower()-(S.mod||0)}
function xgPair(ra,rb,home){const d=(ra-rb)/9;let xa=1.3*Math.exp(d*.55),xb=1.3*Math.exp(-d*.55);if(home===1){xa*=1.15;xb*=.9}else if(home===-1){xa*=.9;xb*=1.15}return [xa,xb]}
function pois(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=R()}while(p>L);return k-1}
function simAI(h,a,neutral){const [xh,xa]=xgPair(S.clubs[h].str+gauss()*1.5,S.clubs[a].str+gauss()*1.5,neutral?0:1);return [pois(xh),pois(xa)]}
function shootout(pa=.76,pb=.76,rnd=R){let a=0,b=0;const seq=[];for(let i=0;i<5;i++){const ka=rnd()<pa,kb=rnd()<pb;a+=ka;b+=kb;seq.push([ka,kb]);if(a>b+(4-i)||b>a+(4-i))break}while(a===b){const ka=rnd()<pa,kb=rnd()<pb;a+=ka;b+=kb;seq.push([ka,kb])}return {a,b,seq}}

/* =================== temporada =================== */
function roundRobin(ids){const arr=shuffleR(ids);const n=arr.length,rounds=[];for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const h=arr[i],w=arr[n-1-i];m.push(r%2===0?[h,w]:[w,h])}rounds.push(m);arr.splice(1,0,arr.pop())}return rounds.concat(rounds.map(rd=>rd.map(([h,w])=>[w,h])))}
function buildCal(){const c=[];const dc=!!S.dcups;for(let r=0;r<18;r++){c.push({t:'lg',r});const d={1:0,5:1,9:2,13:3}[r];if(dc&&d!=null)c.push({t:'dc',s:d});const s={3:0,7:1,11:2,15:3}[r];if(s!=null)c.push({t:'cup',s})}return c}
function cupFrom(ids){const t=shuffleR(ids);const pr=[];for(let i=0;i<16;i+=2)pr.push({a:t[i],b:t[i+1],sa:null,sb:null,w:null,pen:null});return {rounds:[pr],stage:0,winner:null}}
function buildCups(q){S.cups={EU:cupFrom(q.EU),SA:cupFrom(q.SA)}}
function buildDcups(){if(S.clubs.length<=70){S.dcups=null;return}S.dcups={};for(let k=0;k<7;k++){const top=S.clubs.filter(c=>c.lg===k).map(c=>c.id);const d2=S.clubs.filter(c=>c.lg===k+7).sort((a,b)=>b.str-a.str).slice(0,6).map(c=>c.id);S.dcups[k]=cupFrom(top.concat(d2))}}
function initialQual(){const eu=[],sa=[],extra=[];for(let lg=0;lg<7;lg++){const ids=S.clubs.filter(c=>c.lg===lg).sort((a,b)=>b.str-a.str).map(c=>c.id);if(lg<5){eu.push(...ids.slice(0,3));extra.push(ids[3])}else sa.push(...ids.slice(0,8))}extra.sort((a,b)=>S.clubs[b].str-S.clubs[a].str);eu.push(extra[0]);return {EU:eu,SA:sa}}
function qualify(){const eu=[],sa=[],extra=[];for(let lg=0;lg<7;lg++){const ids=sortLeague(lg);if(lg<5){eu.push(...ids.slice(0,3));extra.push(ids[3])}else sa.push(...ids.slice(0,8))}extra.sort((a,b)=>S.tab[b].pts-S.tab[a].pts);eu.push(extra[0]);return {EU:eu,SA:sa}}
function sortLeague(lg){return S.clubs.filter(c=>c.lg===lg).map(c=>c.id).sort((a,b)=>{const A=S.tab[a],B=S.tab[b];return B.pts-A.pts||(B.gp-B.gc)-(A.gp-A.gc)||B.gp-A.gp||S.clubs[b].str-S.clubs[a].str})}
const posOf=cid=>sortLeague(S.clubs[cid].lg).indexOf(cid)+1;
function addRes(h,a,gh,ga){const H=S.tab[h],A=S.tab[a];H.j++;A.j++;H.gp+=gh;H.gc+=ga;A.gp+=ga;A.gc+=gh;if(gh>ga){H.v++;A.d++;H.pts+=3}else if(gh<ga){A.v++;H.d++;A.pts+=3}else{H.e++;A.e++;H.pts++;A.pts++}}
function expRank(cid,list,key){const c=list[cid];return list.filter(x=>x.lg===c.lg).sort((a,b)=>b[key]-a[key]).map(x=>x.id).indexOf(cid)+1}
function goalText(e,d2){if(d2){if(e<=2)return {r:2,t:'Conquistar o acesso'};if(e<=5)return {r:4,t:'Brigar pelo acesso'};return {r:8,t:'Fazer uma campanha segura'}}if(e===1)return {r:1,t:'Ser campeão da liga'};if(e<=3)return {r:3,t:'Terminar no top 3'};if(e<=6)return {r:5,t:'Ficar na metade de cima'};return {r:8,t:'Escapar do rebaixamento'}}
const goalFor=cid=>goalText(expRank(cid,S.clubs,'str'),isD2(S.clubs[cid].lg));
function rivalOf(cid,list){list=list||S.clubs;const c=list[cid];for(const [a,b] of RIV){const o=c.sh===a?b:c.sh===b?a:null;if(o){const r=list.find(x=>x.lg===c.lg&&x.sh===o);if(r)return r.id}}return list.filter(x=>x.lg===c.lg&&x.id!==cid).sort((a,b)=>Math.abs(a.rep-c.rep)-Math.abs(b.rep-c.rep))[0].id}
const pressure=()=>club().rep>=86?1.5:club().rep>=75?1.25:1;
function isWindow(){const e=S.cal[S.wk];return S.wk===0||(e&&e.t==='lg'&&e.r===9)}
function nextFx(){
 const e=S.cal[S.wk];if(!e)return null;const lg=club().lg;
 if(e.t==='lg'){const m=S.fx[lg][e.r].find(([h,a])=>h===S.club||a===S.club);return {comp:'lg',home:m[0],away:m[1],label:`${LEAGUES[lg].name} · Rodada ${e.r+1}`}}
 if(e.t==='cup'){const cup=S.cups[userCont()];const rd=cup.rounds[e.s];const m=rd&&rd.find(x=>x.a===S.club||x.b===S.club);if(!m)return null;return {comp:'cup',home:m.a,away:m.b,neutral:e.s===3,label:`${CUPS[userCont()]} · ${STAGES[e.s]}`}}
 if(e.t==='dc'){const cup=S.dcups&&S.dcups[country()];const rd=cup&&cup.rounds[e.s];const m=rd&&rd.find(x=>x.a===S.club||x.b===S.club);if(!m)return null;return {comp:'dc',home:m.a,away:m.b,neutral:e.s===3,label:`${DCUP[country()]} · ${STAGES[e.s]}`}}
 if(e.t==='mun'&&S.munOpp!=null)return {comp:'mun',home:S.club,away:S.munOpp,neutral:true,label:'Mundial de Clubes · Final'};
 return null;
}
const oppOf=f=>f.home===S.club?f.away:f.home;

function newCareer(name,phil,cid,seed,opts={}){
 S={v:2,rs:seed|0,seed,pid:1,mgr:{name,phil,rep:0,look:opts.look||'suit'},season:1,year:2026,clubs:baseClubs(),club:cid,form:'433',tac:'eq',mod:0,m:{dir:60,tor:55,ves:60,fin:60},cash:0,budget:0,
   flags:{},seen:{},news:[],hist:[],troph:[],res:[],seasonTroph:[],loans:[],perk:{},cast:{},wk:0,phase:'hub',deck:[],di:0,squad:[],
   mode:{hard:!!opts.hard,ch:opts.ch||null,chs:null},ach:{},legends:[],nem:null,taken:{}};
 S.clubs.forEach(c=>c.str=baseStr(c)+gauss()*1.2);applyRealStr();
 S.mgr.rep=Math.round(clamp(S.clubs[cid].rep-8,35,90));
 joinClub(cid);
 S.nem={n:S.cast.rival,cid:rivalOf(cid),w:0,e:0,d:0};
 startSeason(null);

const CARD_BY=Object.fromEntries(CARDS.map(c=>[c.id,c]));
function buildDeck(){
 const g=gw();const ok=c=>{if(c.mk&&!isWindow())return false;const l=S.seen[c.id];if(l!=null&&g-l<(c.cd||10))return false;try{return !c.cond||!!c.cond()}catch(e){return false}};
 const pool=CARDS.filter(ok);const deck=pool.filter(c=>c.w>=1000).map(c=>c.id);
 const mkRest=pool.filter(c=>c.mk&&c.w<1000),rest=pool.filter(c=>!c.mk&&c.w<1000);
 if(isWindow()&&mkRest.length){deck.push(weighted(mkRest,x=>x.w).id)}
 let n=S.wk===0?0:(chance(.5)?2:1);if(deck.length>=3)n=Math.min(n,1);
 for(let i=0;i<n&&rest.length;i++){const c=weighted(rest,x=>x.w);deck.push(c.id);rest.splice(rest.indexOf(c),1)}
 return deck;
}
function applyM(m){if(!m)return;const hard=S.mode&&S.mode.hard;for(const k in m){let v=m[k];if(hard)v=v<0?Math.round(v*1.35):Math.round(v*.85);S.m[k]=clamp(Math.round(S.m[k]+v),0,100)}}
const canAfford=o=>!(o.cash<0&&S.cash+o.cash<-S.budget*.25);
function chooseOpt(op){
 if(op.cash)S.cash=r1(S.cash+op.cash);let r=op.r||'';
 if(op.f){const out=op.f();if(typeof out==='string')r=out;else if(out&&typeof out==='object'){if(out.r)r=out.r;if(out.m)applyM(out.m);if(out.cash)S.cash=r1(S.cash+out.cash)}}
 applyM(op.m);syncStr();return r;
}

function startWeek(){S.deck=buildDeck();S.di=0;S.pendingDeck=false;S.ready=false;CUR=null;S.phase='cards';render()}
function afterCards(){
 if(S.firedReason){resolveWeek(null,true);S.post={nomatch:true,fired:true};S.phase='post';return render()}
 S.pendingDeck=false;CUR=null;
 if(nextFx()){S.ready=true;S.phase='hub';UI.tab='hub';save();toast('Decisões tomadas. Confira o time e inicie o jogo.');return render()}
 resolveWeek(null,false);S.post={nomatch:true};S.phase='post';render();
}
function applyUserResult(M){
 const f=M.fx,su=M.su,so=M.so;const res=su>so?'V':su<so?'D':'E';const pw=M.pens?M.pens.u>M.pens.o:null;
 const ur=M.uH?{h:su,a:so,pen:M.pens?[M.pens.u,M.pens.o]:null}:{h:so,a:su,pen:M.pens?[M.pens.o,M.pens.u]:null};
 const before={...S.m};const posB=f.comp==='lg'?posOf(S.club):null;const e=S.cal[S.wk];
 resolveWeek(ur,false);S.res.push(res);
 const p=pressure(),derby=M.opp===rivalOf(S.club),prom=S.flags.promessa?1.25:1;const dm={dir:0,tor:0,ves:0,fin:0};S.celebrate=null;let advanced=null;
 if(f.comp==='lg'){
  if(res==='V'){dm.dir+=2;dm.tor+=derby?8:4;dm.ves+=2}else if(res==='E'){dm.dir-=p>1?1:0;dm.tor-=Math.round(p)}else{dm.dir-=Math.round(3*p);dm.tor-=Math.round(5*p*(derby?1.6:1)*prom);dm.ves-=2}
  if(e.r>=5){const pos=posOf(S.club);if(pos>S.goal.r+2)dm.dir-=2;else if(pos<=S.goal.r)dm.dir+=1}
 }else{
  advanced=res==='V'||(res==='E'&&pw);
  if(f.comp==='cup'){if(advanced){dm.tor+=4;dm.dir+=2;dm.ves+=2;if(e.s===3){trophy(CUPS[userCont()]);dm.tor+=15;dm.dir+=12;dm.ves+=6;S.mgr.rep+=3}}else{dm.tor-=Math.round(5*p);dm.dir-=Math.round((e.s>=2?2:4)*p)}}
  else if(f.comp==='dc'){const under=S.clubs[M.opp].str>M.up+3;if(advanced){dm.tor+=3;dm.dir+=1;dm.ves+=1;if(e.s===3){trophy(DCUP[country()]);dm.tor+=10;dm.dir+=8;dm.ves+=4;S.mgr.rep+=2}}else{dm.tor-=Math.round((under?1.5:3.5)*p);dm.dir-=Math.round((under?1:2.5)*p)}}
  else if(advanced){trophy('Mundial de Clubes');dm.tor+=12;dm.dir+=8;S.mgr.rep+=3}
 }
 const ids=M.played||new Set(M.xi.map(x=>x.id));
 S.squad.forEach(pl=>{if(ids.has(pl.id)){pl.j++;mor(pl,res==='V'?4:res==='D'?-3:0);if(M.out&&M.out.has(pl.id)===false&&!M.xi.includes(pl))mor(pl,2)}else mor(pl,-1);if(pl.susp>0)pl.susp--});
 (M.injured||[]).forEach(id=>{const pl=byId(id);if(pl){pl.inj=ri(1,5);news(`${pl.n} se lesionou: ${pl.inj} semana(s) fora`)}});
 (M.reds||[]).forEach(id=>{const pl=byId(id);if(pl){pl.susp=Math.max(pl.susp,1);pl.st=pl.st;news(`${pl.n} está suspenso pelo vermelho`)}});
 S.squad.forEach(pl=>{if((pl.yc||0)>=3&&!(M.reds||[]).includes(pl.id)){pl.yc=0;pl.susp=Math.max(pl.susp,1);news(`${pl.n} cumpre suspensão por três amarelos`)}});
 if(!M.played&&chance(.1)){const pl=randP(x=>ids.has(x.id));pl.inj=ri(1,4)}
 M.goals.filter(g=>g.s==='u').forEach(g=>{const pl=byId(g.id);if(pl)mor(pl,6)});
 if(M.uH)S.cash=r1(S.cash+S.budget*.025*(S.perk.estadio?1.6:1));
 if(S.nem&&M.opp===S.nem.cid){const r2=res==='E'&&M.pens?(pw?'V':'D'):res;if(r2==='V')S.nem.w++;else if(r2==='D')S.nem.d++;else S.nem.e++;S.flags.nemPos={r:r2,due:gw()+1}}
 S.mod=0;S.tac='eq';for(const k of MK)if(dm[k]>0&&S.m[k]>75)dm[k]=Math.ceil(dm[k]/2);applyM(dm);syncStr();
 const hc=S.clubs[f.home],ac=S.clubs[f.away];news(`${hc.name} ${ur.h} x ${ur.a} ${ac.name}${ur.pen?` (pên. ${ur.pen[0]}–${ur.pen[1]})`:''}`);
 for(const k of MK)if(S.m[k]<=0&&!S.firedReason)S.firedReason=k;
 const d={};for(const k of MK)d[k]=S.m[k]-before[k];
 achAfterMatch(res,su-so,derby);
 S.ready=false;return {res,su,so,uH:M.uH,f,goals:M.goals,pens:M.pens,d,posB,posA:f.comp==='lg'?posOf(S.club):null,advanced,cel:S.celebrate,st:{su:M.st.su,so:M.st.so,pos:Math.round(M.st.pa/Math.max(1,M.st.pn)*100)}};

function advance(){
 S.squad.forEach(p=>{if(p.inj>0)p.inj--});
 for(const k of MK)if(S.m[k]>80)S.m[k]--;
 if(S.cash<-S.budget*.3)applyM({fin:-4});else if(S.cash<0)applyM({fin:-2});else if(S.cash>S.budget*.6)applyM({fin:1});
 if(!S.firedReason)for(const k of MK)if(S.m[k]<=0)S.firedReason=k;
 S.wk++;S.post=null;S.celebrate=null;UI.sellConf=null;S.ready=false;S.pendingDeck=false;CUR=null;
 if(S.firedReason){simRest();return endSeason(true)}
 if(S.wk>=S.cal.length)return endSeason(false);
 S.phase='hub';UI.tab='hub';save();render();
}

   case 'opppen':{feed(`Pênalti para o ${esc(S.clubs[M.opp].name)}...`);const go3=()=>{if(Math.random()<.74)M.q.unshift({k:'goalO'});else{M.st.so++;feed('O nosso goleiro defende! Que defesa!','gu');if(!sk)scene.shot(os,false)}nextEv()};if(sk)go3();else{whistle();scene.penalty(os);setTimeout(()=>{if(L.alive)go3()},1100)}break}
   case 'ht':{if(!sk)whistle();scene.freeze(true);clk('INT');feed(`Intervalo: ${esc(scoreTxt())}.`);M.on.forEach(p=>M.en[p.id]=Math.min(100,(M.en[p.id]??100)+8));const go2=()=>{feed('Começa o segundo tempo.');scene.reset('a');nextEv()};
    if(M.su<=M.so||Math.random()<.35){const o=[['Ir para cima','of'],['Manter','keep'],['Fechar o time','df']];if(M.subs<M.maxSubs&&M.bench.length)o.push(['Abrir o painel de trocas','subs']);
     ask('Intervalo',M.su<M.so?'Estamos perdendo. O que você diz no vestiário?':M.su===M.so?'Empate no primeiro tempo. Muda alguma coisa?':'Estamos na frente. Como seguimos?',o,1,t=>{if(t==='subs'){openSubs(go2)}else{setTac(t);go2()}})}
    else if(sk)go2();else setTimeout(()=>{if(L.alive)go2()},900);break}
   case 'late':{const lose=M.su<M.so,win=M.su>M.so;
    if(lose&&M.su===M.so-1){const o=[['Abafa total','all']];const atkB=M.bench.filter(x=>x.pos==='ATA').sort((a,b)=>b.ovr-a.ovr)[0];const defOn=M.on.filter(x=>x.pos==='DEF').sort((a,b)=>a.ovr-b.ovr)[0];
      if(atkB&&defOn&&M.subs<M.maxSubs)o.push([`Abafa e colocar ${atkB.n} no lugar de ${defOn.n}`,'allsub']);o.push(['Manter','keep']);
      ask('Reta final','Perdendo por um gol a dez minutos do fim.',o,o.length-1,t=>{if(t==='allsub'){doSub(defOn,atkB);setTac('all')}else setTac(t);nextEv()},'Auxiliar técnico')}
    else if(win&&M.su===M.so+1){const o=[['Fechar a casinha','df'],['Buscar o segundo','of']];const defB=M.bench.filter(x=>x.pos==='DEF').sort((a,b)=>b.ovr-a.ovr)[0];const atkOn=M.on.filter(x=>x.pos==='ATA').sort((a,b)=>a.ovr-b.ovr)[0];
      if(defB&&atkOn&&M.subs<M.maxSubs)o.splice(1,0,[`Fechar e colocar ${defB.n} no lugar de ${atkOn.n}`,'dfsub']);
      ask('Reta final','Vencendo por um gol a dez minutos do fim.',o,0,t=>{if(t==='dfsub'){doSub(atkOn,defB);setTac('df')}else setTac(t);nextEv()},'Auxiliar técnico')}
    else nextEv();break}
   case 'end':finish();break;
  }}
 function subsHTML(sel){
  const row=(p,attr,on)=>{const en=Math.round(M.en[p.id]??100);return `<button class="prow ${sel===p.id?'sel':''}" ${attr}="${p.id}" ${on===false&&(M.subs>=M.maxSubs||sel==null)?'disabled':''}><span class="ovr" style="--o:${ovrCol(p.ovr)}">${p.ovr}</span><span class="pinfo"><b>${esc(p.n)}</b><small>${POSN[p.pos]}${on?` · fôlego ${en}%`:''}</small></span><span></span><span class="enb"><i style="width:${on?en:100}%;background:${!on||en>65?'var(--good)':en>45?'var(--warn)':'var(--bad)'}"></i></span></button>`};
  return `<div class="subh"><h3>Pausa técnica</h3><span>Trocas ${M.subs}/${M.maxSubs}</span></div>
   <div class="seg" id="tacSeg">${Object.keys(TACN).map(k=>`<button data-tac="${k}" class="${M.tac===k?'on':''}">${TACN[k]}</button>`).join('')}</div>
   <p class="tip">${M.subs>=M.maxSubs?'Você já fez todas as substituições.':sel==null?'Toque em quem sai e depois em quem entra.':'Agora escolha quem entra.'}</p>
   <h4>Em campo</h4><div class="grp">${M.on.map(p=>row(p,'data-son',true)).join('')}</div>
   <h4>Banco</h4><div class="grp">${M.bench.length?M.bench.map(p=>row(p,'data-sbn',false)).join(''):'<p class="empty">Ninguém disponível no banco.</p>'}</div>
   <button class="btn big" id="resume">Voltar ao jogo</button>`}
 function openSubs(after){
  M.userPause=true;scene.freeze(true);$('#pz').hidden=false;let sel=null;const box=$('#subs');box.hidden=false;
  const draw=()=>{box.innerHTML=subsHTML(sel);
   box.querySelectorAll('[data-tac]').forEach(b=>b.onclick=()=>{setTac(b.dataset.tac);tick();draw()});
   box.querySelectorAll('[data-son]').forEach(b=>b.onclick=()=>{if(M.subs>=M.maxSubs)return;sel=+b.dataset.son===sel?null:+b.dataset.son;draw()});
   box.querySelectorAll('[data-sbn]').forEach(b=>b.onclick=()=>{if(sel==null||M.subs>=M.maxSubs)return;const out=M.on.find(x=>x.id===sel),inn=M.bench.find(x=>x.id===+b.dataset.sbn);if(doSub(out,inn)){sel=null;draw()}});
   $('#resume').onclick=()=>{box.hidden=true;$('#pz').hidden=true;M.userPause=false;tick();if($('#dec').hidden)scene.freeze(false);if(after)after()}};
  draw();box.scrollIntoView({block:'start',behavior:RM?'auto':'smooth'});
 }
 function end2(){M.done=true;M.pause=true;scene.freeze(true);whistle(true);ambStop();clk('FIM');feed(`Fim de jogo: ${esc(scoreTxt())}.`);$('#mfin').hidden=false;$('#skip').hidden=true;$('#pause').hidden=true;$('#subs').hidden=true;$('#pz').hidden=true}
 function finish(){if(M.done)return;if(M.fx.comp==='lg'||M.su!==M.so)return end2();
  const so=shootout(.76+(M.on.some(p=>p.tr==='frio')?.05:0),.75,Math.random);M.pens={u:so.a,o:so.b};scene.freeze(true);
  if(M.skip){feed(`Nos pênaltis: ${esc(club().sh)} ${so.a} x ${so.b} ${esc(S.clubs[M.opp].sh)}.`);return end2()}
  $('#pause').hidden=true;const d=$('#dec');d.hidden=false;d.innerHTML=`<h3>Disputa de pênaltis</h3><div class="pens"><div><b>${esc(club().sh)}</b><span id="pu"></span></div><div><b>${esc(S.clubs[M.opp].sh)}</b><span id="po"></span></div></div>`;
  const kicks=[];so.seq.forEach(([a,b])=>{kicks.push(['u',a]);kicks.push(['o',b])});let k=0;
  const iv=setInterval(()=>{if(!L.alive)return clearInterval(iv);const [s,ok]=kicks[k++];$(s==='u'?'#pu':'#po').insertAdjacentHTML('beforeend',`<i class="${ok?'ok':'no'}"></i>`);if(ok&&s==='u')tick();
   if(k>=kicks.length){clearInterval(iv);const won=so.a>so.b;feed(`Pênaltis: ${esc(club().sh)} ${so.a} x ${so.b} ${esc(S.clubs[M.opp].sh)}.`,won?'gu':'bad');if(won){crowd(true);confetti([club().c1,club().c2,'#fff'],120)}setTimeout(()=>{if(L.alive)end2()},500)}},650/Math.max(.6,M.speed));
 }
 function frame(now){if(!L.alive){if(ro)ro.disconnect();return}const dt=Math.min(.05,(now-lastT)/1000);lastT=now;T+=dt;
  if(M.skip){let g=0;while(!M.pause&&!M.done&&g++<200)doMinute()}
  else if(!M.pause&&!M.done&&!M.userPause){acc+=dt*1000*M.speed;while(acc>=MS&&!M.pause&&!M.done){acc-=MS;doMinute()}}
  scene.update(dt,T,M.speed);scene.draw(T);requestAnimationFrame(frame)}
 v.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{M.speed=+b.dataset.sp;try{localStorage.setItem('prancheta_speed',String(M.speed))}catch(e){}v.querySelectorAll('[data-sp]').forEach(x=>x.classList.toggle('on',x===b))});
 v.querySelectorAll('[data-tb]').forEach(b=>b.onclick=()=>{if(M.done)return;tick();setTac(b.dataset.tb)});
 $('#pause').onclick=()=>{if(M.done||M.userPause)return;if(!$('#dec').hidden)return toast('Responda a decisão primeiro');openSubs()};
 $('#skip').onclick=()=>{M.skip=true;$('#skip').hidden=true;$('#pause').hidden=true;$('#subs').hidden=true;$('#pz').hidden=true;M.userPause=false;scene.freeze(true);ambStop();if(!$('#dec').hidden){$('#dec').querySelector('.opt')?.click()}};
 $('#mfin').onclick=()=>{S.post=applyUserResult(M);S.phase='post';render()};
 requestAnimationFrame(frame);
 setTimeout(()=>{if(!L.alive)return;scene.reset('h');whistle();ambStart();feed(`Rola a bola! ${esc(hc.name)} x ${esc(acl.name)}.`);M.pause=false},500);
}

/* ----- pós-jogo ----- */
function rrow(m){const h=S.clubs[m.h],a=S.clubs[m.a];return `<div class="rr ${m.h===S.club||m.a===S.club?'me':''}"><span>${crest(h,18)}${esc(h.name)}</span><b>${m.gh} – ${m.ga}${m.pen?` <small>(${m.pen[0]}–${m.pen[1]})</small>`:''}</b><span>${esc(a.name)}${crest(a,18)}</span></div>`}
function renderPost(){
 const P=S.post,v=$('#view');let top='';
 if(P.nomatch){top=P.fired||S.firedReason?`<div class="banner bad"><div><p class="eyebrow">Fim da linha</p><h3>Demitido</h3><p>${FIRE[S.firedReason]||''} O resto da temporada vai ser simulado.</p></div></div>`:`<div class="ph"><p class="eyebrow">${weekLbl()}</p><h1>Semana sem jogo</h1></div>`}
 else{const f=P.f,h=S.clubs[f.home],a=S.clubs[f.away];const hv=P.uH?P.su:P.so,av=P.uH?P.so:P.su;
  const word=P.res==='V'?'Vitória':P.res==='D'?'Derrota':P.pens?(P.advanced?'Classificado':'Eliminado'):'Empate';const cls=P.res!=='E'?P.res:P.pens?(P.advanced?'V':'D'):'';
  const gl=s=>P.goals.filter(g=>g.s===s).map(g=>`${esc(g.n)} ${g.m}'`).join('<br>')||'—';
  const st=P.st||{su:0,so:0,pos:50};const hs=P.uH?st.su:st.so,as=P.uH?st.so:st.su,hpos=P.uH?st.pos:100-st.pos;
  top=`<div class="ph"><p class="eyebrow">${esc(f.label)}</p><h1 class="${cls}">${word}</h1><div class="pscore">${crest(h,52)}<span>${hv} – ${av}</span>${crest(a,52)}</div>${P.pens?`<p style="color:var(--mute)">Pênaltis: ${P.uH?P.pens.u:P.pens.o} – ${P.uH?P.pens.o:P.pens.u}</p>`:''}</div>
   <div class="scr"><div>${P.uH?gl('u'):gl('o')}</div><div>${P.uH?gl('o'):gl('u')}</div></div>
   <div class="mstats"><b>${hpos}%</b><span>Posse de bola</span><b>${100-hpos}%</b><span></span><div class="sbar"><i style="width:${hpos}%"></i></div><span></span><b>${hs}</b><span>Finalizações</span><b>${as}</b></div>
   ${P.cel?`<div class="banner">${trophySVG()}<div><p class="eyebrow">É campeão!</p><h3>${esc(P.cel)}</h3></div></div>`:''}
   <div class="deltas">${MK.map(k=>`<div><b class="${P.d[k]>0?'p':P.d[k]<0?'n':''}">${P.d[k]>0?'+':''}${P.d[k]}</b>${ML[k]}</div>`).join('')}</div>
   ${P.posA?`<p class="goal"><span>Posição na liga</span><em>${P.posA}º${P.posB&&P.posB!==P.posA?` <small style="font-size:13px;color:${P.posA<P.posB?'var(--good)':'var(--bad)'}">${P.posA<P.posB?'▲':'▼'} ${Math.abs(P.posB-P.posA)}</small>`:''}</em></p>`:''}
   ${S.firedReason?`<div class="banner bad"><div><p class="eyebrow">Fim da linha</p><h3>Demitido</h3><p>${FIRE[S.firedReason]}</p></div></div>`:''}`;}
 const lw=S.lastWeek;const list=lw&&lw.list?lw.list:[];
 v.innerHTML=`<section class="post">${top}${list.length?`<h3 class="sec">${lw.t==='lg'?'Resultados da rodada':'Resultados da copa'}</h3><div class="results">${list.map(rrow).join('')}</div>`:''}<button class="btn big" id="cont">${S.firedReason?'Ver o fim da temporada':'Continuar'}</button></section>`;
 $('#cont').onclick=()=>{tick();advance()};
 if(P.cel&&!P.celShown){P.celShown=true;setTimeout(()=>ceremony(P.cel,`${club().name} · ${seasonLbl()}`),350)}
}

/* ----- fim de temporada ----- */
function renderEnd(){
 const E=S.end,c=club(),v=$('#view');
 if(E.gameover){
  v.innerHTML=`<section class="endv"><p class="eyebrow">Hardcore</p><h1>Fim de carreira</h1>
   <div class="endpos">${crest(c,64)}<div><b>${esc(c.name)}</b><small>${esc(E.reason||'Você foi demitido.')}</small></div></div>
   <div class="deltas"><div><b>${S.hist.length}</b>Temporadas</div><div><b>${S.troph.length}</b>Títulos</div><div><b>${S.mgr.rep}</b>Reputação</div><div><b>${ACH.filter(a=>S.ach[a[0]]).length}</b>Conquistas</div></div>
   ${S.troph.length?`<div class="cab">${S.troph.map(t=>`<div class="tro">${trophySVG()}<b>${esc(t.n)}</b><small>${t.y}</small></div>`).join('')}</div>`:''}
   <button class="btn big" id="again">Nova carreira</button>${credit()}</section>`;
  $('#again').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}S=null;LAST=null;UI.screen='title';render()};return;
 }
 const chal=E.chal?`<div class="banner ${E.chal.st==='ok'?'good':'bad'}"><div><p class="eyebrow">Desafio · ${esc(E.chal.n)}</p><h3>${E.chal.st==='ok'?'Missão cumprida':'Desafio perdido'}</h3></div></div>`:'';
 if(E.chal&&E.chal.st==='ok'){try{const d=JSON.parse(localStorage.getItem('prancheta_chal')||'{}')||{};d[S.mode.ch]=1;localStorage.setItem('prancheta_chal',JSON.stringify(d))}catch(e){}}
 v.innerHTML=`<section class="endv"><p class="eyebrow">Fim da temporada ${seasonLbl()}</p><h1>${esc(E.verdict)}</h1>
  <div class="endpos">${crest(c,64)}<div><b>${E.pos}º lugar</b><small>${LEAGUES[E.lg].name} · meta: ${S.goal.t.toLowerCase()}</small>${isD2(E.lg)?'':`<small>${CUPS[userCont()]}: ${E.cup}</small>`}<small>${DCUP[country()]}: ${E.dcup}</small>${E.top?`<small>Artilheiro: ${esc(E.top.n)} (${E.top.g} gols)</small>`:''}</div></div>
  ${chal}
  ${E.troph.length?`<div class="cab">${E.troph.map(t=>`<div class="tro">${trophySVG()}<b>${esc(t)}</b><small>${seasonLbl()}</small></div>`).join('')}</div>`:''}
  ${E.reason?`<p class="reason">${esc(E.reason)}</p>`:E.note==='rebaixado'?'<p class="reason">O clube vai disputar a segunda divisão na próxima temporada.</p>':E.note==='acesso'?'<p class="reason">O clube volta para a primeira divisão!</p>':''}
  <p class="goal"><span>Reputação de técnico</span><em>${S.mgr.rep} <small style="font-size:14px;color:${E.rd>=0?'var(--good)':'var(--bad)'}">${E.rd>=0?'+':''}${E.rd}</small></em></p>
  <h3 class="sec">Campeões das ligas</h3><div class="champs">${E.champs.map((id,i)=>`<div>${crest(S.clubs[id],22)}<span style="min-width:0"><b>${esc(S.clubs[id].name)}</b><small>${LEAGUES[i].name}</small></span></div>`).join('')}</div>
  <h3 class="sec">Propostas na mesa</h3><div class="offers">${E.offers.map(o=>{const oc=S.clubs[o.cid];return `<div class="offer" style="--oc:${oc.c1}">${crest(oc,52)}<div style="min-width:0"><h3>${esc(oc.name)}</h3><p>${LEAGUES[oc.lg].name} · meta: ${goalFor(o.cid).t.toLowerCase()}</p><p>Salário: ${money(o.sal)} por ano · orçamento ${money(budgetOf(oc))}</p></div><button class="btn" data-o="${o.cid}">Assinar com o ${esc(oc.sh)}</button></div>`}).join('')}</div>
  ${E.fired?'':`<button class="btn big ghost" id="stay">Ficar no ${esc(c.name)}</button>`}</section>`;
 v.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{whistle();newSeason(+b.dataset.o)});
 const sy=$('#stay');if(sy)sy.onclick=()=>{tick();newSeason(S.club)};
 if(E.cer&&!E.cerDone){E.cerDone=true;save();setTimeout(()=>ceremony(E.cer,`${c.name} · ${seasonLbl()}`),400)}
}

/* =================== início =================== */
function boot(data){
 let saved=null;if(data&&data.save){try{saved=JSON.parse(data.save)}catch(e){}}
 if(saved&&saved.clubs){S=migrate(saved);if(S.phase==='cards')S.pendingDeck=true;if(S.phase==='match')S.ready=true;if(S.phase!=='end')S.phase='hub';UI.screen=null;render()}else{S=null;UI.screen='title';render()}
}
window.pranchetaBack=()=>{
 const cer=document.querySelector('.cer');if(cer){cer.remove();return 'ok'}
 if(!S){if(UI.screen==='setup'){if(UI.setup.step===2){UI.setup.step=1;UI.setup.edit=false}else UI.screen=UI.setup.ch?'chal':'title';render();return 'ok'}if(UI.screen==='chal'||UI.screen==='help'){UI.screen='title';render();return 'ok'}return 'exit'}
 if(S.phase==='hub'){if(UI.edOpen){UI.edOpen=false;UI.edCid=null;renderHub();return 'ok'}if(UI.tab!=='hub'){UI.tab='hub';UI.sel=null;renderHub();return 'ok'}return 'exit'}
 if(S.phase==='cards'){S.pendingDeck=true;S.phase='hub';UI.tab='hub';save();render();return 'ok'}
 toast(S.phase==='end'?'Escolha o seu próximo clube antes de sair':S.phase==='match'?'Pause a partida pelo botão Pausar':'Termine a semana antes de sair');return 'ok'};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&S.phase!=='match')save()});
if('serviceWorker' in navigator&&location.protocol==='https:'&&document.querySelector('link[rel="manifest"]')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
window.claude?.hot?.snapshot?.(()=>({save:LAST}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
